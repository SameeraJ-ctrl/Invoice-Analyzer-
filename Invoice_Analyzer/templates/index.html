<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Invoice Pattern Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Invoice Pattern Analyzer</h1>
        <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
            <input type="file" name="file" multiple required>
            <button type="submit">Upload CSV Files</button>
        </form>
        <p class="note">Upload invoices to analyze billing patterns and errors.</p>
    </div>
</body>
</html>
